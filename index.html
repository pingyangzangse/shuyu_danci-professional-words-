<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>术语闪卡</title>
<style>
  :root {
    --bg:#f4f8f6; --card:#ffffff; --accent:#3aa88f; --accent-soft:#e3f3ee;
    --good:#3aa88f; --good-soft:#e3f3ee; --bad:#e0885e; --bad-soft:#fceee5;
    --text:#2e3a38; --dim:#8ba39d; --line:#e2ece8;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
         min-height:100vh; display:flex; flex-direction:column; max-width:520px; margin:0 auto; padding:0 16px; }

  header { padding:20px 0 6px; text-align:center; }
  h1 { font-size:20px; font-weight:600; letter-spacing:2px; }
  .stats { font-size:12px; color:var(--dim); margin-top:6px; }
  .stats b { color:var(--accent); font-weight:600; }
  .progress { height:4px; background:var(--line); border-radius:2px; margin-top:10px; overflow:hidden; }
  .progress i { display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .3s; }

  /* 顶部视图切换 */
  .tabs { display:flex; background:var(--accent-soft); border-radius:12px; padding:4px; margin:12px 0 4px; }
  .tab { flex:1; text-align:center; padding:9px 0; font-size:14px; border-radius:9px; cursor:pointer;
         color:var(--accent); user-select:none; transition:all .2s; }
  .tab.active { background:#fff; color:var(--text); font-weight:600; box-shadow:0 2px 8px rgba(58,168,143,.15); }

  .controls { display:flex; gap:8px; padding:10px 0; flex-wrap:wrap; }
  select, .toggle, .search { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px;
                    padding:8px 10px; font-size:13px; outline:none; }
  select { flex:1; min-width:0; }
  .search { width:100%; }
  .toggle { cursor:pointer; text-align:center; user-select:none; flex:1; }
  .toggle.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }

  /* ===== 闪卡视图 ===== */
  .card-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:6px 0; perspective:1000px; }
  .card { width:100%; min-height:340px; position:relative; cursor:pointer;
          transform-style:preserve-3d; transition:transform .45s; }
  .card.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; background:var(--card); border:1px solid var(--line); border-radius:20px;
          box-shadow:0 10px 34px rgba(58,168,143,.10);
          backface-visibility:hidden; -webkit-backface-visibility:hidden;
          display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 22px; text-align:center; }
  .face.back { transform:rotateY(180deg); }
  .tag { position:absolute; top:14px; left:16px; font-size:11px; color:var(--dim); }
  .badge { position:absolute; top:14px; right:16px; font-size:11px; padding:3px 10px; border-radius:20px; display:none; }
  .badge.known { display:block; color:var(--good); background:var(--good-soft); }
  .badge.unfamiliar { display:block; color:var(--bad); background:var(--bad-soft); }
  .abbr { font-size:42px; font-weight:700; letter-spacing:1px; color:var(--accent); word-break:break-word; }
  .hint { position:absolute; bottom:16px; font-size:12px; color:var(--dim); }
  .full { font-size:21px; font-weight:600; color:var(--text); line-height:1.4; margin-bottom:16px; word-break:break-word; }
  .meaning { font-size:14.5px; line-height:1.8; color:#5a6b66; }

  .buttons { display:grid; grid-template-columns:1fr 1.5fr 1.5fr 1fr; gap:8px; padding:10px 0 26px; }
  .btn { border-radius:14px; padding:14px 0; font-size:15px; font-weight:600; cursor:pointer;
         background:var(--card); color:var(--text); border:1px solid var(--line); }
  .btn:active { opacity:.7; }
  .btn.good { background:var(--good); color:#fff; border-color:var(--good); }
  .btn.bad { background:var(--bad); color:#fff; border-color:var(--bad); }

  /* ===== 词表视图 ===== */
  .list-wrap { flex:1; overflow-y:auto; padding-bottom:24px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:8px;
         display:flex; gap:12px; align-items:flex-start; }
  .dot { width:9px; height:9px; border-radius:50%; margin-top:6px; flex-shrink:0; background:var(--line); }
  .dot.known { background:var(--good); }
  .dot.unfamiliar { background:var(--bad); }
  .row-main { flex:1; min-width:0; }
  .row-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .row-abbr { font-weight:700; color:var(--accent); font-size:15px; }
  .row-full { font-size:13px; color:var(--text); }
  .row-meaning { font-size:12.5px; color:var(--dim); line-height:1.6; margin-top:4px; }
  .row-cat { font-size:11px; color:var(--dim); background:var(--accent-soft); padding:2px 8px; border-radius:10px;
             flex-shrink:0; white-space:nowrap; }
  .empty { text-align:center; color:var(--dim); padding:60px 0; font-size:14px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>术语闪卡</h1>
  <div class="stats" id="stats"></div>
  <div class="progress"><i id="bar"></i></div>
</header>

<div class="tabs">
  <div class="tab active" id="tabFlash">闪卡模式</div>
  <div class="tab" id="tabList">全部词表</div>
</div>

<!-- 闪卡视图 -->
<div id="viewFlash" style="display:flex;flex-direction:column;flex:1;">
  <div class="controls">
    <select id="domainSel">
      <option value="">全部领域</option>
      <option value="制造">制造</option>
      <option value="AI">AI</option>
    </select>
    <select id="catSel"><option value="">全部小类</option></select>
    <div class="toggle" id="shuffleBtn">随机</div>
    <div class="toggle" id="unfamiliarBtn">只看不熟</div>
  </div>
  <div class="card-wrap">
    <div class="card" id="card">
      <div class="face front">
        <span class="tag" id="tagF"></span>
        <span class="badge" id="badgeF"></span>
        <div class="abbr" id="abbr"></div>
        <span class="hint">点击卡片查看全称与释义</span>
      </div>
      <div class="face back">
        <span class="tag" id="tagB"></span>
        <div class="full" id="full"></div>
        <div class="meaning" id="meaning"></div>
      </div>
    </div>
  </div>
  <div class="buttons">
    <button class="btn" id="prev">‹</button>
    <button class="btn bad" id="markUnfamiliar">还不熟</button>
    <button class="btn good" id="markKnown">已掌握</button>
    <button class="btn" id="next">›</button>
  </div>
</div>

<!-- 词表视图 -->
<div id="viewList" class="hidden" style="display:flex;flex-direction:column;flex:1;">
  <div class="controls">
    <input class="search" id="search" placeholder="搜索缩写 / 全称 / 中文释义">
    <select id="listDomainSel">
      <option value="">全部领域</option>
      <option value="制造">制造</option>
      <option value="AI">AI</option>
    </select>
    <div class="toggle" id="listKnownOnly">只看已掌握</div>
    <div class="toggle" id="listUnfOnly">只看不熟</div>
  </div>
  <div class="list-wrap" id="list"></div>
</div>

<script>
const TERMS = [{"abbr":"IPD","full":"Integrated Product Development","meaning":"集成产品开发：源自 IBM/PRTM 的一套端到端产品开发管理体系，华为 1999 年引入，是研发流程的核心框架。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"OR","full":"Offering Requirements","meaning":"产品包需求：IPD 中对产品包（含产品+服务+资料）完整需求的定义与管理流程。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"MM","full":"Market Management","meaning":"市场管理：IPD 的前端流程，通过市场细分、组合分析制定业务计划，输出产品线规划。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"Charter","full":"Charter（Project Charter）","meaning":"项目任务书：IPMT 签发给 PDT 的正式授权文件，明确产品包的初始商业计划与资源承诺。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"CDP","full":"Charter Development Process","meaning":"Charter 开发流程：从概念到立项任务书形成的流程，把市场机会转化为可批准的项目任务书。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"PDT","full":"Product Development Team","meaning":"产品开发团队：IPD 中跨功能部门的重量级团队，负责把产品包推向市场并对商业成功负责。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"LMT","full":"Lifecycle Management Team","meaning":"生命周期管理团队：产品上市后负责优化现有产品包业务结果，管理供货、生产与退役。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"TR","full":"Technology Review","meaning":"技术评审：IPD 流程中 TR1~TR6 各阶段的技术成熟度和质量评审点。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"DCP","full":"Decision Check Point","meaning":"决策评审点：IPD 中由 IPMT 进行的业务决策评审，决定项目继续/终止/转向（如 Charter DCP、Plan DCP）。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"GA","full":"General Availability","meaning":"通用可获得性/正式发布：产品完成量产准备、面向市场全面发布的里程碑。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"EOM","full":"End of Marketing","meaning":"停止营销：产品生命周期中停止市场销售的里程碑节点。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"EOS","full":"End of Service/Support","meaning":"停止服务/支持：产品停止维修与技术支持服务的里程碑节点。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"EOP","full":"End of Production","meaning":"停止生产：产品生命周期中终止生产的里程碑节点。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"IPMT","full":"Integrated Portfolio Management Team","meaning":"集成组合管理团队：产品线级决策团队，负责产品组合管理并批准 PDT 的立项与各 DCP。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"IRB","full":"Investment Review Board","meaning":"投资评审委员会：公司级高层跨功能团队，确定长期战略方向并管理跨产品线的投资。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"ITMT","full":"Integrated Technology Management Team","meaning":"集成技术管理团队：负责 CBB 共用基础模块和长期技术开发策略的跨功能团队。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"PMT","full":"Portfolio Management Team","meaning":"组合管理团队：协助 IPMT/IRB 确定业务投资优先级、管理整体产品组合的团队。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"TDT","full":"Technology Development Team","meaning":"技术开发团队：负责平台与核心技术开发、向 PDT 输出成熟技术的团队。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"RMT","full":"Requirements Management Team","meaning":"需求管理团队：跨部门团队，负责需求的收集、分析、分发与实现跟踪决策。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"LTC","full":"Lead To Cash","meaning":"从线索到回款：华为三大主业务流程之一，覆盖销售线索到合同交付回款的端到端流程。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"ITR","full":"Issue To Resolution","meaning":"从问题到解决：华为主业务流程之一，管理客户服务请求/问题到解决关闭的全过程。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"ISC","full":"Integrated Supply Chain","meaning":"集成供应链：华为主业务流程之一，端到端集成计划、采购、制造、物流的供应链体系。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"CBB","full":"Common Building Block","meaning":"共用基础模块：可在多产品间复用的标准化模块/技术，IPD 降本增效的重要手段。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"重量级团队","full":"Heavyweight Team","meaning":"重量级团队：由跨功能部门核心成员组成、被充分授权并对结果负责的项目团队形式。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"BP","full":"Business Plan","meaning":"业务计划：MM 与 IPD 流程中产出的产品线/产品包商业计划文档。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"Roadmap","full":"Product Roadmap","meaning":"产品路标：产品线未来产品与技术演进的规划图，MM 流程的重要输出。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"PAC","full":"Product Approval Committee","meaning":"产品审批委员会（部分企业用法）：对项目立项与阶段决策进行审批的组织，功能类似 IPMT。","domain":"制造","category":"IPD 流程与组织"},{"abbr":"CTQ","full":"Critical To Quality","meaning":"关键质量特性：对客户满意至关重要的、可测量的产品特性，由客户需求转化而来。","domain":"制造","category":"需求与质量管理"},{"abbr":"CPK","full":"Process Capability Index","meaning":"过程能力指数：衡量受控过程满足规格限能力的指标，≥1.33 通常视为合格。","domain":"制造","category":"需求与质量管理"},{"abbr":"Ppk","full":"Process Performance Index","meaning":"过程性能指数：用长期（含波动）数据计算的过程性能指标，与 CPK 互为补充。","domain":"制造","category":"需求与质量管理"},{"abbr":"DPPM","full":"Defective Parts Per Million","meaning":"百万分之不良数：每百万个产品中的缺陷品数量，衡量出货质量水平的关键指标。","domain":"制造","category":"需求与质量管理"},{"abbr":"FMEA","full":"Failure Mode and Effects Analysis","meaning":"失效模式与影响分析：系统识别潜在失效模式、评估风险并制定预防措施的质量工具。","domain":"制造","category":"需求与质量管理"},{"abbr":"DFMEA","full":"Design FMEA","meaning":"设计失效模式分析：针对产品设计阶段识别设计缺陷风险的 FMEA。","domain":"制造","category":"需求与质量管理"},{"abbr":"PFMEA","full":"Process FMEA","meaning":"过程失效模式分析：针对制造/装配过程识别过程失效风险的 FMEA。","domain":"制造","category":"需求与质量管理"},{"abbr":"QFD","full":"Quality Function Deployment","meaning":"质量功能展开：用质量屋把客户需求逐级转化为设计要求、工艺要求的结构化方法。","domain":"制造","category":"需求与质量管理"},{"abbr":"SPC","full":"Statistical Process Control","meaning":"统计过程控制：用控制图等统计方法监控过程稳定性、预防异常波动的质量管理技术。","domain":"制造","category":"需求与质量管理"},{"abbr":"MSA","full":"Measurement System Analysis","meaning":"测量系统分析：评估测量设备与方法的变差是否满足要求的分析方法。","domain":"制造","category":"需求与质量管理"},{"abbr":"GRR","full":"Gauge Repeatability and Reproducibility","meaning":"量具重复性与再现性：MSA 的核心指标，评估测量系统变差占总变差的比例。","domain":"制造","category":"需求与质量管理"},{"abbr":"DOE","full":"Design of Experiments","meaning":"实验设计：通过有计划的实验安排高效找出关键影响因子与最优参数组合的方法。","domain":"制造","category":"需求与质量管理"},{"abbr":"8D","full":"Eight Disciplines","meaning":"八步法：团队导向的问题解决方法（D1~D8），广泛用于客户投诉与质量异常处理。","domain":"制造","category":"需求与质量管理"},{"abbr":"AQL","full":"Acceptable Quality Limit","meaning":"可接受质量限：抽样检验中可接受的最差过程平均质量水平，用于抽样方案设计。","domain":"制造","category":"需求与质量管理"},{"abbr":"ORT","full":"Ongoing Reliability Test","meaning":"持续可靠性测试：量产阶段定期抽样进行的可靠性验证，监控产品质量稳定性。","domain":"制造","category":"需求与质量管理"},{"abbr":"MTBF","full":"Mean Time Between Failures","meaning":"平均故障间隔时间：可维修产品相邻两次故障间的平均工作时间，可靠性核心指标。","domain":"制造","category":"需求与质量管理"},{"abbr":"MTTR","full":"Mean Time To Repair","meaning":"平均修复时间：产品发生故障后恢复功能所需的平均时间。","domain":"制造","category":"需求与质量管理"},{"abbr":"FIT","full":"Failures In Time","meaning":"十亿小时故障数：每 10 亿器件工作小时的失效次数，电子元器件可靠性单位。","domain":"制造","category":"需求与质量管理"},{"abbr":"DFR","full":"Design for Reliability","meaning":"可靠性设计：在设计阶段系统开展可靠性预计、分配、分析与验证的设计方法（亦见 DFX 家族）。","domain":"制造","category":"需求与质量管理"},{"abbr":"SQE","full":"Supplier Quality Engineer","meaning":"供应商质量工程师：负责供应商质量评估、辅导与来料质量问题处理的岗位。","domain":"制造","category":"需求与质量管理"},{"abbr":"IQC","full":"Incoming Quality Control","meaning":"来料质量控制：对采购物料入库前进行的检验与质量把关。","domain":"制造","category":"需求与质量管理"},{"abbr":"IPQC","full":"In-Process Quality Control","meaning":"制程质量控制：生产过程中对工序质量的巡回检验与控制。","domain":"制造","category":"需求与质量管理"},{"abbr":"OQC","full":"Outgoing Quality Control","meaning":"出货质量控制：产品出厂前的最终质量检验，防止不良品流出。","domain":"制造","category":"需求与质量管理"},{"abbr":"FQC","full":"Final Quality Control","meaning":"最终质量控制：产品完工后对成品进行的质量检验（常位于 OQC 之前）。","domain":"制造","category":"需求与质量管理"},{"abbr":"PQA","full":"Product Quality Assurance","meaning":"产品质量保证：IPD 中负责产品全流程质量策划与质量目标达成的角色/活动。","domain":"制造","category":"需求与质量管理"},{"abbr":"CAR","full":"Corrective Action Request","meaning":"纠正措施要求：针对已发生不合格要求责任方分析根因并实施纠正的正式文件。","domain":"制造","category":"需求与质量管理"},{"abbr":"SCAR","full":"Supplier Corrective Action Request","meaning":"供应商纠正措施要求：发给供应商、要求其就质量问题提交根因分析与纠正措施的正式要求。","domain":"制造","category":"需求与质量管理"},{"abbr":"NCR","full":"Non-Conformance Report","meaning":"不合格报告：记录不合格品事实、评审与处置结论的质量记录。","domain":"制造","category":"需求与质量管理"},{"abbr":"MRB","full":"Material Review Board","meaning":"物料评审委员会：对不合格物料/产品进行评审并决定处置（返工、让步、报废等）的组织。","domain":"制造","category":"需求与质量管理"},{"abbr":"FA","full":"Failure Analysis","meaning":"失效分析：对失效样品进行理化/电学分析以定位根因的技术活动。","domain":"制造","category":"需求与质量管理"},{"abbr":"COPQ","full":"Cost of Poor Quality","meaning":"劣质成本：因质量问题产生的内部+外部损失成本，用于质量经济性管理。","domain":"制造","category":"需求与质量管理"},{"abbr":"FPY","full":"First Pass Yield","meaning":"一次通过率：产品不经返工一次通过全部工序的比率，衡量制程质量水平。","domain":"制造","category":"需求与质量管理"},{"abbr":"RTY","full":"Rolled Throughput Yield","meaning":"流通合格率：各工序一次通过率连乘得到的整体直通率指标。","domain":"制造","category":"需求与质量管理"},{"abbr":"PPM","full":"Parts Per Million","meaning":"百万分率：质量水平计量单位，常与 DPPM 混用指百万分之缺陷数。","domain":"制造","category":"需求与质量管理"},{"abbr":"DFX","full":"Design for X / Design for Excellence","meaning":"面向卓越设计：在设计阶段综合考虑制造、装配、测试、成本、可靠性等全生命周期要素的设计方法论总称。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFM","full":"Design for Manufacturability","meaning":"可制造性设计：使产品设计易于加工制造、降低制造成本与质量风险的设计方法。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFA","full":"Design for Assembly","meaning":"可装配性设计：减少零件数、简化装配方向与操作，提高装配效率的设计方法。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFT","full":"Design for Test","meaning":"可测试性设计：在设计中预留测试点与边界扫描等结构，保证产品可测、测得全。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFC","full":"Design for Cost","meaning":"面向成本设计：以目标成本为约束开展设计，实现成本最优的设计方法。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFS","full":"Design for Service","meaning":"可服务性设计：使产品易于安装、维护与维修的设计方法。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFE","full":"Design for Environment","meaning":"面向环境设计：考虑可回收、低能耗与环保合规的绿色设计方法。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFR(DFX)","full":"Design for Reliability","meaning":"面向可靠性设计：DFX 家族成员，设计中内建可靠性保障（同 DFR）。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFSC","full":"Design for Supply Chain","meaning":"面向供应链设计：设计时考虑物料可获得性、供应风险与全球交付的设计方法。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFSS","full":"Design for Six Sigma","meaning":"六西格玛设计：面向新产品/流程开发、从源头保证 6σ 质量水平的设计方法（DMADV）。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DTC","full":"Design To Cost","meaning":"按成本设计：先定目标成本再反向约束设计方案的成本管理方法。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFL","full":"Design for Logistics","meaning":"面向物流设计：设计时考虑包装、运输与仓储效率的设计方法。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"DFRem","full":"Design for Remanufacture","meaning":"面向再制造设计：使产品便于拆解、翻新与再制造的设计方法。","domain":"制造","category":"可制造性设计 DFX 家族"},{"abbr":"NPI","full":"New Product Introduction","meaning":"新产品导入：把研发成果转化为可批量生产产品的试制验证与量产准备过程。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"EVT","full":"Engineering Verification Test","meaning":"工程验证测试：硬件开发早期对工程样机进行功能/性能验证的阶段。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"DVT","full":"Design Verification Test","meaning":"设计验证测试：对接近最终设计的产品进行全面设计符合性验证的阶段。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"PVT","full":"Production Verification Test","meaning":"生产验证测试：用量产工艺与产线进行小批量试产、验证量产可行性的阶段。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"MP","full":"Mass Production","meaning":"批量生产：通过全部验证后进入大规模量产的阶段。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"Ramp-up","full":"Ramp-up（产能爬坡）","meaning":"产能爬坡：从试产到满产逐步提升产量与良率的过程。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"PPAP","full":"Production Part Approval Process","meaning":"生产件批准程序：汽车行业要求供应商在批量供货前提交全套证据获得批准的程序。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"APQP","full":"Advanced Product Quality Planning","meaning":"产品质量先期策划：汽车行业产品开发五阶段质量策划框架（IATF16949 核心工具）。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"BOM","full":"Bill of Materials","meaning":"物料清单：描述产品由哪些物料及数量构成的结构化清单。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"EBOM","full":"Engineering BOM","meaning":"工程物料清单：研发视角按设计结构组织的 BOM。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"MBOM","full":"Manufacturing BOM","meaning":"制造物料清单：面向生产、按工艺与装配顺序组织的 BOM。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"ECN","full":"Engineering Change Notice","meaning":"工程变更通知：正式通知并执行设计/物料/工艺变更的文件。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"ECR","full":"Engineering Change Request","meaning":"工程变更请求：提出变更申请并启动变更评审流程的文件。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"ECO","full":"Engineering Change Order","meaning":"工程变更指令：批准后下达执行变更的正式指令（常与 ECN 同义使用）。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"PCN","full":"Product Change Notification","meaning":"产品变更通知：供应商向客户正式告知产品/工艺/材料变更的通知（华为等公司有标准 PCN 流程）。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"EOL(变更)","full":"End of Life（物料停产）","meaning":"物料生命周期终止：元器件供应商宣布停产的物料管理场景，需启动替代与最后采购。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"AVL","full":"Approved Vendor List","meaning":"合格供应商清单：经认证批准、可供采购选用的供应商名录。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"SMT","full":"Surface Mount Technology","meaning":"表面贴装技术：将元器件贴装到 PCB 表面的电子组装主流工艺。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"DIP","full":"Dual In-line Package","meaning":"双列直插式封装/插件工艺：通孔插装元器件的封装形式及其插装工艺段。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"ICT","full":"In-Circuit Test","meaning":"在线测试：用针床治具对 PCBA 进行元器件级电气测试的方法。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"FCT","full":"Functional Circuit Test","meaning":"功能测试：对 PCBA 或整机通电进行功能与性能验证的测试。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"AOI","full":"Automated Optical Inspection","meaning":"自动光学检测：用机器视觉自动检查贴装与焊接外观缺陷的设备/工序。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"AXI","full":"Automated X-ray Inspection","meaning":"自动 X 射线检测：用 X 光检查 BGA 等隐藏焊点质量的检测方法。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"SPI","full":"Solder Paste Inspection","meaning":"锡膏检测：SMT 印刷后对锡膏厚度/面积进行 3D 检测的工序。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"ICT 治具","full":"ICT Fixture（测试针床）","meaning":"测试针床治具：ICT 测试中与被测板测点接触的定制针床工装。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"Golden Sample","full":"Golden Sample（黄金样品）","meaning":"黄金样品/标准样件：作为检验与判定基准的经确认的合格样品。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"Pilot Run","full":"Pilot Production Run","meaning":"试产/小批量试制：量产前为验证工艺与产线进行的小批量生产。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"ORT 老化","full":"Burn-in","meaning":"老化测试：通过高温/长时间加电运行剔除早期失效品的筛选试验。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"Reliability Test","full":"Reliability Qualification Test","meaning":"可靠性鉴定试验：高低温、湿热、振动、跌落等环境应力验证试验的统称。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"FA（首件）","full":"First Article Inspection (FAI)","meaning":"首件检验：每班/换线后对首件产品进行全面尺寸与性能确认的质量活动。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"PCBA","full":"Printed Circuit Board Assembly","meaning":"印制电路板组件：完成元器件贴装/插装焊接后的电路板半成品。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"DFM 分析","full":"DFM Analysis","meaning":"可制造性分析：试制前用软件/评审对 PCB 与结构设计进行制造可行性检查的活动。","domain":"制造","category":"试制与量产（NPI）"},{"abbr":"ISC（供应链）","full":"Integrated Supply Chain","meaning":"集成供应链：见 IPD 板块，此处强调其计划-采购-制造-交付一体化运作。","domain":"制造","category":"供应链与制造系统"},{"abbr":"MRP","full":"Material Requirements Planning","meaning":"物料需求计划：根据主生产计划与 BOM 计算物料需求数量与时间的计划方法。","domain":"制造","category":"供应链与制造系统"},{"abbr":"MRP II","full":"Manufacturing Resource Planning","meaning":"制造资源计划：在 MRP 基础上扩展能力、财务等资源的闭环计划体系。","domain":"制造","category":"供应链与制造系统"},{"abbr":"ERP","full":"Enterprise Resource Planning","meaning":"企业资源计划：集成财务、采购、生产、销售等企业核心业务流程的信息系统。","domain":"制造","category":"供应链与制造系统"},{"abbr":"MES","full":"Manufacturing Execution System","meaning":"制造执行系统：面向车间层的生产执行与过程追溯信息系统。","domain":"制造","category":"供应链与制造系统"},{"abbr":"PLM","full":"Product Lifecycle Management","meaning":"产品生命周期管理：管理产品从概念到退役全过程数据与流程的系统/理念。","domain":"制造","category":"供应链与制造系统"},{"abbr":"WMS","full":"Warehouse Management System","meaning":"仓库管理系统：管理入库、存储、拣选、出库等仓储作业的信息系统。","domain":"制造","category":"供应链与制造系统"},{"abbr":"TMS","full":"Transportation Management System","meaning":"运输管理系统：管理运输计划、承运商与在途跟踪的信息系统。","domain":"制造","category":"供应链与制造系统"},{"abbr":"APS","full":"Advanced Planning and Scheduling","meaning":"高级计划与排程：基于约束进行精细化生产计划与排产的系统。","domain":"制造","category":"供应链与制造系统"},{"abbr":"SRM","full":"Supplier Relationship Management","meaning":"供应商关系管理：管理供应商准入、绩效与协同的系统/体系。","domain":"制造","category":"供应链与制造系统"},{"abbr":"JIT","full":"Just In Time","meaning":"准时制生产：在需要的时间按需要的数量生产/配送所需物品，追求零库存。","domain":"制造","category":"供应链与制造系统"},{"abbr":"Lean","full":"Lean Manufacturing","meaning":"精益生产：以消除浪费、持续改善为核心的生产方式，源自丰田。","domain":"制造","category":"供应链与制造系统"},{"abbr":"TPS","full":"Toyota Production System","meaning":"丰田生产方式：精益生产的源头体系，两大支柱为 JIT 与自働化。","domain":"制造","category":"供应链与制造系统"},{"abbr":"TQM","full":"Total Quality Management","meaning":"全面质量管理：全员参与、全过程、全组织的质量管理理念与体系。","domain":"制造","category":"供应链与制造系统"},{"abbr":"TPM","full":"Total Productive Maintenance","meaning":"全员生产维护：全员参与设备维护、追求设备零故障的管理方法。","domain":"制造","category":"供应链与制造系统"},{"abbr":"OEE","full":"Overall Equipment Effectiveness","meaning":"设备综合效率：时间开动率×性能开动率×合格品率，衡量设备利用水平。","domain":"制造","category":"供应链与制造系统"},{"abbr":"Kanban","full":"Kanban（看板）","meaning":"看板：以卡片/信号拉动生产与物料补充的目视化管理工具。","domain":"制造","category":"供应链与制造系统"},{"abbr":"VMI","full":"Vendor Managed Inventory","meaning":"供应商管理库存：由供应商根据共享数据负责补货与管理客户库存的模式。","domain":"制造","category":"供应链与制造系统"},{"abbr":"EOL","full":"End of Life","meaning":"生命周期终止：产品停止销售/生产/支持的退役阶段统称。","domain":"制造","category":"供应链与制造系统"},{"abbr":"L/T","full":"Lead Time","meaning":"交付周期/提前期：从下单到交付所需的时间。","domain":"制造","category":"供应链与制造系统"},{"abbr":"MOQ","full":"Minimum Order Quantity","meaning":"最小起订量：供应商可接受的单次最小订货数量。","domain":"制造","category":"供应链与制造系统"},{"abbr":"MPQ","full":"Minimum Package Quantity","meaning":"最小包装量：物料最小包装单位所含数量，采购须按其整数倍下单。","domain":"制造","category":"供应链与制造系统"},{"abbr":"Safety Stock","full":"Safety Stock","meaning":"安全库存：为应对需求与供应波动而设置的缓冲库存。","domain":"制造","category":"供应链与制造系统"},{"abbr":"Cycle Time","full":"Cycle Time","meaning":"节拍/循环时间：完成一个工序或产品所需的实际时间。","domain":"制造","category":"供应链与制造系统"},{"abbr":"Takt Time","full":"Takt Time","meaning":"生产节拍：按客户需求速率计算出的单位产品应耗费的时间。","domain":"制造","category":"供应链与制造系统"},{"abbr":"Andon","full":"Andon（安灯）","meaning":"安灯系统：现场异常即时声光报警、快速响应的目视管理装置。","domain":"制造","category":"供应链与制造系统"},{"abbr":"Poka-Yoke","full":"Poka-Yoke（防错法）","meaning":"防错/防呆：通过设计使错误不可能发生或能立即被发现的措施。","domain":"制造","category":"供应链与制造系统"},{"abbr":"5S","full":"5S（Seiri/Seiton/Seiso/Seiketsu/Shitsuke）","meaning":"整理、整顿、清扫、清洁、素养：现场管理的基础方法。","domain":"制造","category":"供应链与制造系统"},{"abbr":"Kaizen","full":"Kaizen（持续改善）","meaning":"持续改善：全员参与的小步快跑式改进活动，精益文化核心。","domain":"制造","category":"供应链与制造系统"},{"abbr":"Bottleneck","full":"Bottleneck（瓶颈工序）","meaning":"瓶颈：限制整个系统产出能力的最薄弱环节（TOC 约束理论关注对象）。","domain":"制造","category":"供应链与制造系统"},{"abbr":"TOC","full":"Theory of Constraints","meaning":"约束理论：聚焦识别并突破系统瓶颈以提升整体产出的管理方法。","domain":"制造","category":"供应链与制造系统"},{"abbr":"WIP","full":"Work In Process","meaning":"在制品：生产线上处于加工过程中的半成品库存。","domain":"制造","category":"供应链与制造系统"},{"abbr":"EHS","full":"Environment, Health and Safety","meaning":"环境、健康与安全：工厂环境与职业健康安全管理体系的统称。","domain":"制造","category":"供应链与制造系统"},{"abbr":"ISO9001","full":"ISO 9001 Quality Management Systems","meaning":"质量管理体系标准：国际通用的质量管理体系认证标准。","domain":"制造","category":"制造标准与认证"},{"abbr":"IATF16949","full":"IATF 16949 Automotive QMS","meaning":"汽车行业质量管理体系：基于 ISO9001 的汽车行业专用质量标准。","domain":"制造","category":"制造标准与认证"},{"abbr":"ISO14001","full":"ISO 14001 Environmental Management","meaning":"环境管理体系标准：组织环境管理的国际认证标准。","domain":"制造","category":"制造标准与认证"},{"abbr":"ISO45001","full":"ISO 45001 Occupational Health & Safety","meaning":"职业健康安全管理体系标准：替代 OHSAS18001 的国际标准。","domain":"制造","category":"制造标准与认证"},{"abbr":"QC080000","full":"IECQ QC 080000 HSPM","meaning":"有害物质过程管理体系：针对 RoHS 等有害物质管控的过程管理体系标准。","domain":"制造","category":"制造标准与认证"},{"abbr":"TL9000","full":"TL 9000 Telecom QMS","meaning":"通信行业质量管理体系：QuEST 论坛制定的电信行业专用质量标准。","domain":"制造","category":"制造标准与认证"},{"abbr":"IPC-A-610","full":"IPC-A-610 Acceptability of Electronic Assemblies","meaning":"电子组件可接受性标准：PCBA 焊接与组装质量判定的行业通用标准。","domain":"制造","category":"制造标准与认证"},{"abbr":"J-STD-001","full":"IPC J-STD-001 Soldering Requirements","meaning":"焊接电气电子组件要求：IPC 的焊接工艺与材料要求标准。","domain":"制造","category":"制造标准与认证"},{"abbr":"IPC-6012","full":"IPC-6012 Rigid PCB Qualification","meaning":"刚性印制板鉴定与性能规范：PCB 板厂验收的常用标准。","domain":"制造","category":"制造标准与认证"},{"abbr":"RoHS","full":"Restriction of Hazardous Substances","meaning":"欧盟有害物质限制指令：限制电子电气产品中铅等 10 类有害物质。","domain":"制造","category":"制造标准与认证"},{"abbr":"REACH","full":"Registration, Evaluation, Authorisation and Restriction of Chemicals","meaning":"欧盟化学品注册评估许可与限制法规：管控化学物质（含 SVHC 高关注物质）。","domain":"制造","category":"制造标准与认证"},{"abbr":"CE","full":"Conformité Européenne","meaning":"欧盟符合性标志：产品进入欧盟市场的强制性安全合格标志。","domain":"制造","category":"制造标准与认证"},{"abbr":"UL","full":"Underwriters Laboratories","meaning":"美国保险商试验所认证：北美市场广泛认可的产品安全认证。","domain":"制造","category":"制造标准与认证"},{"abbr":"FCC","full":"Federal Communications Commission","meaning":"美国联邦通信委员会认证：电子产品电磁兼容进入美国市场的强制认证。","domain":"制造","category":"制造标准与认证"},{"abbr":"CCC","full":"China Compulsory Certification","meaning":"中国强制性产品认证：列入目录产品在中国市场销售的强制认证（3C）。","domain":"制造","category":"制造标准与认证"},{"abbr":"GR-487","full":"Telcordia GR-487","meaning":"电信设备户外机柜通用要求：Telcordia 制定的户外通信设备环境防护标准。","domain":"制造","category":"制造标准与认证"},{"abbr":"Telcordia","full":"Telcordia（原 Bellcore）","meaning":"电信行业可靠性标准机构：其 GR 系列标准广泛用于通信设备可靠性与环境要求。","domain":"制造","category":"制造标准与认证"},{"abbr":"GR-63","full":"Telcordia GR-63 (NEBS)","meaning":"网络设备建筑系统要求：电信设备抗震、防火等物理环境标准（NEBS 核心）。","domain":"制造","category":"制造标准与认证"},{"abbr":"IEC","full":"International Electrotechnical Commission","meaning":"国际电工委员会：制定电工电子领域国际标准的组织，如 IEC61000 EMC 系列。","domain":"制造","category":"制造标准与认证"},{"abbr":"EMC","full":"Electromagnetic Compatibility","meaning":"电磁兼容：设备在电磁环境中正常工作且不干扰他设备的能力（EMI+EMS）。","domain":"制造","category":"制造标准与认证"},{"abbr":"ESD","full":"Electrostatic Discharge","meaning":"静电放电：静电释放对电子器件的损伤问题，制造现场须执行 ANSI/ESD S20.20 防护体系。","domain":"制造","category":"制造标准与认证"},{"abbr":"MSL","full":"Moisture Sensitivity Level","meaning":"湿敏等级：塑封器件对潮湿敏感程度的分级（J-STD-020），管控车间暴露时间。","domain":"制造","category":"制造标准与认证"},{"abbr":"WEEE","full":"Waste Electrical and Electronic Equipment","meaning":"欧盟废弃电子电气设备指令：规范电子废弃物回收处理的法规。","domain":"制造","category":"制造标准与认证"},{"abbr":"ATEX","full":"ATmosphères EXplosibles","meaning":"欧盟防爆指令：用于爆炸性环境设备的强制认证。","domain":"制造","category":"制造标准与认证"},{"abbr":"英文缩写/名称","full":"英文全称","meaning":"中文含义与解释","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Transformer","full":"Transformer","meaning":"自注意力架构，现代大模型的基础网络结构","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Self-Attention","full":"Self-Attention","meaning":"自注意力机制，让序列内每个位置关注其他位置以捕捉上下文关系","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"MHA","full":"Multi-Head Attention","meaning":"多头注意力，将注意力拆成多个头并行学习不同类型的依赖关系","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"GQA","full":"Grouped-Query Attention","meaning":"分组查询注意力，多个 Query 头共享 KV 头以降低推理显存","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"MLA","full":"Multi-head Latent Attention","meaning":"多头潜在注意力，DeepSeek 提出的低秩 KV 压缩注意力以减小 KV Cache","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Positional Encoding","full":"Positional Encoding","meaning":"位置编码，为无序的注意力机制注入 token 位置信息","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"RoPE","full":"Rotary Position Embedding","meaning":"旋转位置编码，用旋转矩阵将相对位置信息编码进 Q/K 向量","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"ALiBi","full":"Attention with Linear Biases","meaning":"线性偏置注意力，用与距离成正比的偏置替代显式位置编码，利于外推长上下文","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Embedding","full":"Embedding / Word Embedding","meaning":"词嵌入，把离散 token 映射为连续稠密向量","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Tokenization","full":"Tokenization","meaning":"分词，把文本切分成模型可处理的 token 序列","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"BPE","full":"Byte-Pair Encoding","meaning":"字节对编码，通过反复合并高频相邻字符对构建子词词表","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Token","full":"Token","meaning":"词元，模型处理文本的最小单位（子词、字或字节）","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Vocabulary","full":"Vocabulary","meaning":"词表，模型可识别的全部 token 集合","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"KV Cache","full":"Key-Value Cache","meaning":"键值缓存，推理时缓存已计算的注意力 K/V 以避免重复计算","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Flash Attention","full":"Flash Attention","meaning":"一种 IO 感知的精确注意力算法，通过分块计算大幅减少显存读写","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"MoE","full":"Mixture of Experts","meaning":"混合专家，每层含多个专家子网络，路由器按 token 激活其中少数专家以扩大参数量而不增计算量","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"MLP","full":"Multilayer Perceptron","meaning":"多层感知机，Transformer 中紧随注意力的前馈网络（FFN）","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"FFN","full":"Feed-Forward Network","meaning":"前馈网络，Transformer 块中的两层全连接非线性变换模块","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"LayerNorm","full":"Layer Normalization","meaning":"层归一化，对每个样本的特征维度做归一化以稳定训练","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"RMSNorm","full":"Root Mean Square Layer Normalization","meaning":"均方根层归一化，LayerNorm 的简化变体，计算更省","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Residual","full":"Residual / Skip Connection","meaning":"残差连接，将输入直接加到输出上以缓解深层网络梯度消失","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Encoder","full":"Encoder","meaning":"编码器，将输入序列编码为上下文表示的结构（如 BERT）","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Decoder","full":"Decoder","meaning":"解码器，基于已有上下文自回归生成输出的结构（如 GPT）","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"GPT","full":"Generative Pre-trained Transformer","meaning":"生成式预训练 Transformer，OpenAI 的仅解码器自回归模型系列","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"BERT","full":"Bidirectional Encoder Representations from Transformers","meaning":"基于 Transformer 的双向编码器表示，Google 的掩码语言模型","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"T5","full":"Text-to-Text Transfer Transformer","meaning":"统一为文本到文本范式的编码器-解码器模型（Google）","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"LLM","full":"Large Language Model","meaning":"大语言模型，参数规模巨大的预训练语言模型","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"SLM","full":"Small Language Model","meaning":"小语言模型，参数量较小、可端侧部署的语言模型","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Attention Mechanism","full":"Attention Mechanism","meaning":"注意力机制，按相关性加权聚合信息的核心计算范式","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Softmax","full":"Softmax","meaning":"归一化指数函数，把 logits 转成概率分布","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Logits","full":"Logits","meaning":"模型输出层未经 Softmax 的原始分数","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Parameter","full":"Parameter","meaning":"参数，模型训练中学习得到的权重数值","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"FLOPs","full":"Floating-Point Operations","meaning":"浮点运算次数，衡量模型训练/推理计算量的指标","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Scaling Law","full":"Scaling Law","meaning":"缩放定律，模型性能随参数/数据/算力增长呈幂律关系的经验规律","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Emergent Ability","full":"Emergent Ability","meaning":"涌现能力，模型规模超过阈值后突然出现的新能力","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Context Length","full":"Context Length","meaning":"上下文长度，模型一次可处理的 token 上限","domain":"AI","category":"基础架构与原理（Architecture & Fundamentals）"},{"abbr":"Pre-training","full":"Pre-training","meaning":"预训练，在海量无标注语料上做自监督学习获得通用能力","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Post-training","full":"Post-training","meaning":"后训练，预训练之后的对齐训练阶段（SFT、RLHF 等）","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"SFT","full":"Supervised Fine-Tuning","meaning":"监督微调，用人工标注的指令-回答数据微调模型","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Instruction Tuning","full":"Instruction Tuning","meaning":"指令微调，用自然语言指令数据训练模型遵循指令","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"LoRA","full":"Low-Rank Adaptation","meaning":"低秩适配，冻结原权重、只训练低秩矩阵的高效微调方法","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"QLoRA","full":"Quantized Low-Rank Adaptation","meaning":"量化低秩适配，在 4-bit 量化模型上做 LoRA 以大幅降低显存需求","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"DoRA","full":"Weight-Decomposed Low-Rank Adaptation","meaning":"权重分解低秩适配，将权重分解为方向与幅度再微调，效果接近全参","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Adapter","full":"Adapter (Layer)","meaning":"适配器，在层间插入小型可训练模块的参数高效微调方法","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Prefix-Tuning","full":"Prefix-Tuning","meaning":"前缀微调，只优化输入前缀的连续向量而冻结模型本体","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"P-Tuning","full":"P-Tuning","meaning":"可学习的连续提示向量微调，GPT 也能用于 NLU 任务","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"PEFT","full":"Parameter-Efficient Fine-Tuning","meaning":"参数高效微调，只训练少量参数的各类微调方法总称","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"FFT","full":"Full Fine-Tuning","meaning":"全参数微调，更新模型全部参数的微调方式","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"RL","full":"Reinforcement Learning","meaning":"强化学习，通过与环境交互、依据奖励信号优化策略的学习范式","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"RLHF","full":"Reinforcement Learning from Human Feedback","meaning":"基于人类反馈的强化学习，用人类偏好训练奖励模型再优化策略","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"RLAIF","full":"Reinforcement Learning from AI Feedback","meaning":"基于 AI 反馈的强化学习，用 AI 代替人类标注偏好以降低成本","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"PPO","full":"Proximal Policy Optimization","meaning":"近端策略优化，RLHF 中最常用的稳定策略梯度算法","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"DPO","full":"Direct Preference Optimization","meaning":"直接偏好优化，无需奖励模型、直接用偏好对数据对齐的方法","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"KTO","full":"Kahneman-Tversky Optimization","meaning":"基于前景理论的优化，只需二元好坏反馈而非成对偏好的对齐方法","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"GRPO","full":"Group Relative Policy Optimization","meaning":"组相对策略优化，DeepSeek 提出的免价值网络的强化学习算法","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Reward Model","full":"Reward Model","meaning":"奖励模型，学习人类偏好并为模型输出打分供 RL 优化","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Distillation","full":"Knowledge Distillation","meaning":"知识蒸馏，用大模型（教师）的输出训练小模型（学生）","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Quantization","full":"Quantization","meaning":"量化，把权重/激活从高精度（FP16）压到低比特（INT8/INT4）以省显存提速","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"GPTQ","full":"Generalized Post-Training Quantization","meaning":"通用后训练量化，逐层基于二阶信息补偿误差的量化算法","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"AWQ","full":"Activation-aware Weight Quantization","meaning":"激活感知权重量化，保护对激活影响大的重要权重的量化方法","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"GGUF","full":"GPT-Generated Unified Format","meaning":"llama.cpp 使用的统一量化模型文件格式","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Pruning","full":"Pruning","meaning":"剪枝，删除不重要的权重或结构以压缩模型","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Catastrophic Forgetting","full":"Catastrophic Forgetting","meaning":"灾难性遗忘，微调新任务时模型丢失原先学到的能力","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Overfitting","full":"Overfitting","meaning":"过拟合，模型在训练集表现好但泛化到未见数据差","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Learning Rate","full":"Learning Rate","meaning":"学习率，控制每次梯度更新步长的超参数","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Batch Size","full":"Batch Size","meaning":"批大小，一次前向/反向传播处理的样本数","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Epoch","full":"Epoch","meaning":"轮次，完整遍历一遍训练数据集称为一个 Epoch","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Checkpoint","full":"Checkpoint","meaning":"检查点，训练过程中保存的模型权重快照","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Loss","full":"Loss Function","meaning":"损失函数，衡量预测与目标差距、被优化最小化的目标","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Gradient Descent","full":"Gradient Descent","meaning":"梯度下降，沿损失函数负梯度方向更新参数的优化方法","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Adam","full":"Adaptive Moment Estimation","meaning":"自适应矩估计优化器，深度学习最常用的优化算法","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Warmup","full":"Learning Rate Warmup","meaning":"学习率预热，训练初期逐步增大学习率以稳定训练","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Gradient Clipping","full":"Gradient Clipping","meaning":"梯度裁剪，限制梯度范数防止梯度爆炸","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Mixed Precision","full":"Mixed Precision Training","meaning":"混合精度训练，FP16/BF16 与 FP32 混用以加速训练并省显存","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Continual Pre-training","full":"Continual Pre-training","meaning":"继续预训练，在已有模型上追加领域语料继续自监督训练","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Curriculum Learning","full":"Curriculum Learning","meaning":"课程学习，按由易到难的顺序安排训练样本","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Regularization","full":"Regularization","meaning":"正则化，抑制过拟合的技术总称（Dropout、权重衰减等）","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Dropout","full":"Dropout","meaning":"随机失活，训练时随机丢弃部分神经元以防过拟合","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Early Stopping","full":"Early Stopping","meaning":"早停，验证集指标不再提升时提前终止训练","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Hyperparameter","full":"Hyperparameter","meaning":"超参数，训练前人为设定、不随梯度更新的参数（如学习率）","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Evaluation","full":"Model Evaluation","meaning":"模型评估，用验证/测试集或基准衡量模型性能","domain":"AI","category":"训练与微调（Training & Fine-Tuning）"},{"abbr":"Inference","full":"Inference","meaning":"推理，用训练好的模型对新输入生成输出","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Decoding","full":"Decoding (Sampling Strategy)","meaning":"解码，从模型输出概率分布中选取下一个 token 的策略","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Greedy Decoding","full":"Greedy Decoding","meaning":"贪心解码，每步直接选概率最高的 token","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Temperature","full":"Temperature","meaning":"温度，缩放 logits 以控制输出随机性（越低越确定）","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Top-p","full":"Top-p (Nucleus Sampling)","meaning":"核采样，只在累积概率达 p 的最小 token 集合中采样","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Top-k","full":"Top-k Sampling","meaning":"只在概率最高的 k 个 token 中采样","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Beam Search","full":"Beam Search","meaning":"束搜索，同时保留多条高分候选序列以求更优整体输出","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Streaming","full":"Streaming Output","meaning":"流式输出，逐 token 实时返回生成结果","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Speculative Decoding","full":"Speculative Decoding","meaning":"投机解码，用小模型起草、大模型验证以加速推理","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"vLLM","full":"vLLM (Versatile LLM serving)","meaning":"高性能 LLM 推理服务框架，核心是 PagedAttention 显存管理","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"PagedAttention","full":"PagedAttention","meaning":"vLLM 提出的分页式 KV Cache 管理技术，减少显存碎片","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"TGI","full":"Text Generation Inference","meaning":"Hugging Face 出品的大模型推理服务框架","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"TensorRT-LLM","full":"TensorRT-LLM","meaning":"NVIDIA 推出的 LLM 推理优化引擎","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"llama.cpp","full":"llama.cpp","meaning":"Georgi Gerganov 开源的 C/C++ 本地 LLM 推理引擎","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Ollama","full":"Ollama","meaning":"本地一键运行开源大模型的工具","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"GPU","full":"Graphics Processing Unit","meaning":"图形处理器，AI 训练与推理的主力算力硬件","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"NPU","full":"Neural Processing Unit","meaning":"神经网络处理器，端侧 AI 推理专用芯片","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"TPU","full":"Tensor Processing Unit","meaning":"张量处理器，Google 自研的 AI 加速芯片","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"CUDA","full":"Compute Unified Device Architecture","meaning":"NVIDIA 的统一计算架构，GPU 并行编程平台","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"VRAM","full":"Video Random Access Memory","meaning":"显存，GPU 上存储模型权重与中间计算的高速内存","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Context Window","full":"Context Window","meaning":"上下文窗口，模型单次可处理的最大 token 数","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Latency","full":"Latency","meaning":"延迟，从发出请求到收到响应的耗时","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Throughput","full":"Throughput","meaning":"吞吐，单位时间处理的 token 或请求数","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"TTFT","full":"Time To First Token","meaning":"首 token 延迟，请求到首个输出 token 的时间","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"TPOT","full":"Time Per Output Token","meaning":"每输出 token 时间，生成阶段相邻 token 的平均间隔","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Prefill","full":"Prefill","meaning":"预填充阶段，一次性处理全部输入 prompt 生成首个 token","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Decode Stage","full":"Decode Stage","meaning":"解码阶段，逐 token 自回归生成后续输出","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Batching","full":"Continuous Batching","meaning":"连续批处理，动态合并请求以提升 GPU 利用率的调度技术","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Quantized Inference","full":"Quantized Inference","meaning":"量化推理，用低比特权重做推理以降低显存占用","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Deployment","full":"Model Deployment","meaning":"模型部署，将模型上线为可被调用的服务","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"API","full":"Application Programming Interface","meaning":"应用程序编程接口，调用模型服务的标准方式","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"ONNX","full":"Open Neural Network Exchange","meaning":"开放神经网络交换格式，跨框架的模型表示标准","domain":"AI","category":"推理与部署（Inference & Deployment）"},{"abbr":"Prompt","full":"Prompt","meaning":"提示词，用户提供给模型的输入指令或上下文","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"Prompt Engineering","full":"Prompt Engineering","meaning":"提示词工程，系统性设计提示词以引导模型输出期望结果","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"System Prompt","full":"System Prompt","meaning":"系统提示词，设定模型行为与人格的最高优先级指令","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"Few-shot","full":"Few-shot Prompting","meaning":"少样本提示，在提示中给出若干示例让模型举一反三","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"Zero-shot","full":"Zero-shot Prompting","meaning":"零样本提示，不给示例直接让模型完成任务","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"One-shot","full":"One-shot Prompting","meaning":"单样本提示，只给一个示例的提示方式","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"CoT","full":"Chain-of-Thought","meaning":"思维链，引导模型逐步推理后再给出答案","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"ToT","full":"Tree of Thoughts","meaning":"思维树，让模型并行探索多条推理路径并搜索最优解","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"ReAct","full":"Reasoning + Acting","meaning":"推理与行动结合范式，让模型交替进行思考与工具调用","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"Self-Consistency","full":"Self-Consistency","meaning":"自洽性，采样多条推理路径后投票取最一致答案","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"Role Prompt","full":"Role Prompting","meaning":"角色提示，为模型指定身份/角色以塑造回答风格","domain":"AI","category":"提示词与对齐（Prompting & Alignment）"},{"abbr":"Jailbreak","full":"Jailbreak","meaning":"越狱，用诱导性提示绕过模型安全限制的攻击方式","domain":"A ","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"FAISS","full":"Facebook AI Similarity Search","meaning":"Meta 开源的高性能向量相似度检索库","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Agent","full":"AI Agent","meaning":"智能体，能自主规划、调用工具并完成多步任务的 AI 系统","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"MCP","full":"Model Context Protocol","meaning":"模型上下文协议，Anthropic 提出的连接模型与外部工具/数据源的标准协议","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Function Calling","full":"Function Calling","meaning":"函数调用，模型按结构化格式请求执行外部函数","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Tool Use","full":"Tool Use","meaning":"工具使用，模型调用搜索引擎、计算器等外部工具完成任务","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Workflow","full":"Workflow","meaning":"工作流，把 AI 与业务逻辑按固定流程编排的执行链路","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Orchestration","full":"Agent Orchestration","meaning":"智能体编排，协调多个 Agent/步骤协同完成复杂任务","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Multimodal","full":"Multimodal","meaning":"多模态，同时处理文本、图像、音频等多种输入输出形态","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"VLM","full":"Vision-Language Model","meaning":"视觉语言模型，能理解图像与文本的多模态模型","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Diffusion","full":"Diffusion Model","meaning":"扩散模型，通过逐步去噪生成图像的生成模型","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Stable Diffusion","full":"Stable Diffusion","meaning":"Stability AI 开源的潜空间扩散文生图模型","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"CLIP","full":"Contrastive Language-Image Pre-training","meaning":"对比语言-图像预训练，OpenAI 的图文对齐模型","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Text-to-Image","full":"Text-to-Image Generation","meaning":"文生图，根据文字描述生成图像","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"ASR","full":"Automatic Speech Recognition","meaning":"自动语音识别，把语音转成文字","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"TTS","full":"Text-to-Speech","meaning":"语音合成，把文字转成语音","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Copilot","full":"AI Copilot","meaning":"AI 副驾驶，嵌入工作流程辅助人类完成任务的 AI 助手","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Chatbot","full":"Chatbot","meaning":"聊天机器人，以对话形式与用户交互的 AI 应用","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Benchmark","full":"Benchmark","meaning":"基准测试，标准化评估模型能力的数据集与方法","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"MMLU","full":"Massive Multitask Language Understanding","meaning":"大规模多任务语言理解基准，覆盖 57 个学科的综合评测","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"HumanEval","full":"HumanEval","meaning":"OpenAI 发布的代码生成能力评测基准","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"C-Eval","full":"C-Eval","meaning":"面向中文知识与推理能力的综合评测基准","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"LLaMA","full":"Large Language Model Meta AI","meaning":"Meta 开源的大语言模型系列","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Qwen","full":"Qwen (Tongyi Qianwen)","meaning":"通义千问，阿里巴巴开源的大语言模型系列","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"DeepSeek","full":"DeepSeek","meaning":"深度求索开源的大语言模型系列（V3、R1 等）","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Mistral","full":"Mistral AI Models","meaning":"法国 Mistral AI 开源的高效语言模型系列","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Gemma","full":"Gemma","meaning":"Google 基于 Gemini 技术的开源模型系列","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Hugging Face","full":"Hugging Face","meaning":"最大的开源模型与数据集社区平台","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"OpenAI API","full":"OpenAI API","meaning":"OpenAI 提供的模型调用接口，事实上的行业标准","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Fine-tuning Platform","full":"Fine-tuning Platform","meaning":"微调平台，提供低门槛模型微调训练的云服务","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"LangChain","full":"LangChain","meaning":"流行的 LLM 应用开发框架，提供链式调用与 Agent 组件","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"LlamaIndex","full":"LlamaIndex","meaning":"专注数据接入与 RAG 的 LLM 应用框架","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Prompt Template","full":"Prompt Template","meaning":"提示词模板，带占位符的可复用提示结构","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Semantic Search","full":"Semantic Search","meaning":"语义搜索，按含义而非关键词匹配检索内容","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Chatbot Arena","full":"Chatbot Arena (LMSYS)","meaning":"大模型匿名对战排行榜，基于人类投票的 Elo 评测","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Grounding","full":"Grounding","meaning":"接地，让模型回答锚定到检索到的真实来源以减少幻觉","domain":"AI","category":"应用与生态（Applications & Ecosystem）"},{"abbr":"Fine-tuning","full":"Fine-tuning","meaning":"微调，在预训练模型基础上用特定数据继续训练以适应任务","domain":"AI","category":"应用与生态（Applications & Ecosystem）"}];
const key = t => t.abbr + t.full;
const $ = id => document.getElementById(id);
const store = {
  get known() { return new Set(JSON.parse(localStorage.getItem("fc_known") || "[]")); },
  set known(s) { localStorage.setItem("fc_known", JSON.stringify([...s])); },
  get unfamiliar() { return new Set(JSON.parse(localStorage.getItem("fc_unfamiliar") || "[]")); },
  set unfamiliar(s) { localStorage.setItem("fc_unfamiliar", JSON.stringify([...s])); }
};

let shuffle = localStorage.getItem("fc_shuffle") === "1";
let onlyUnfamiliar = localStorage.getItem("fc_onlyunf") === "1";
let deck = [], idx = 0;

/* ---------- 闪卡视图 ---------- */
function buildDeck() {
  const d = $("domainSel").value, c = $("catSel").value;
  const unf = store.unfamiliar;
  deck = TERMS.filter(t =>
    (!d || t.domain === d) && (!c || t.category === c) &&
    (!onlyUnfamiliar || unf.has(key(t))));
  if (shuffle) {
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
  }
  idx = Math.min(idx, Math.max(deck.length - 1, 0));
  renderCard();
}

function statusOf(t) {
  if (store.known.has(key(t))) return "known";
  if (store.unfamiliar.has(key(t))) return "unfamiliar";
  return "";
}

function renderCard() {
  $("card").classList.remove("flipped");
  const badge = $("badgeF");
  if (!deck.length) {
    $("abbr").textContent = "—"; $("full").textContent = ""; $("meaning").textContent = "";
    $("tagF").textContent = ""; $("tagB").textContent = "";
    badge.className = "badge"; badge.textContent = "";
    $("stats").innerHTML = "当前筛选下没有卡片（若开了「只看不熟」，说明全部掌握啦）";
    $("bar").style.width = "0%";
    return;
  }
  const t = deck[idx];
  $("abbr").textContent = t.abbr;
  $("full").textContent = t.full;
  $("meaning").textContent = t.meaning;
  $("tagF").textContent = $("tagB").textContent = t.domain + " · " + t.category;
  const st = statusOf(t);
  badge.className = "badge" + (st ? " " + st : "");
  badge.textContent = st === "known" ? "已掌握" : st === "unfamiliar" ? "还不熟" : "";
  const k = store.known;
  const knownInDeck = deck.filter(x => k.has(key(x))).length;
  $("stats").innerHTML = "第 <b>" + (idx + 1) + "</b> / " + deck.length + " 张 · 已掌握 <b>" + knownInDeck + "</b> 张 · 词库共 " + TERMS.length + " 条";
  $("bar").style.width = ((idx + 1) / deck.length * 100) + "%";
}

function mark(which) {
  const t = deck[idx]; if (!t) return;
  const k = store.known, u = store.unfamiliar;
  if (which === "known") { k.add(key(t)); u.delete(key(t)); }
  else { u.add(key(t)); k.delete(key(t)); }
  store.known = k; store.unfamiliar = u;
  if (idx < deck.length - 1) idx++;
  if (onlyUnfamiliar) buildDeck(); else renderCard();
}

$("card").onclick = () => $("card").classList.toggle("flipped");
$("prev").onclick = () => { if (idx > 0) { idx--; renderCard(); } };
$("next").onclick = () => { if (idx < deck.length - 1) { idx++; renderCard(); } };
$("markKnown").onclick = () => mark("known");
$("markUnfamiliar").onclick = () => mark("unfamiliar");
$("domainSel").onchange = () => { refreshCats(); buildDeck(); };
$("catSel").onchange = buildDeck;
$("shuffleBtn").onclick = () => {
  shuffle = !shuffle; localStorage.setItem("fc_shuffle", shuffle ? "1" : "0");
  $("shuffleBtn").classList.toggle("on", shuffle); buildDeck();
};
$("unfamiliarBtn").onclick = () => {
  onlyUnfamiliar = !onlyUnfamiliar; localStorage.setItem("fc_onlyunf", onlyUnfamiliar ? "1" : "0");
  $("unfamiliarBtn").classList.toggle("on", onlyUnfamiliar); buildDeck();
};

function refreshCats() {
  const d = $("domainSel").value;
  const cats = [...new Set(TERMS.filter(t => !d || t.domain === d).map(t => t.category))];
  $("catSel").innerHTML = '<option value="">全部小类</option>' + cats.map(c => '<option>' + c + '</option>').join("");
}

/* ---------- 词表视图 ---------- */
function renderList() {
  const q = $("search").value.trim().toLowerCase();
  const d = $("listDomainSel").value;
  const k = store.known, u = store.unfamiliar;
  const rows = TERMS.filter(t => {
    if (d && t.domain !== d) return false;
    const st = statusOf(t);
    if ($("listKnownOnly").classList.contains("on") && st !== "known") return false;
    if ($("listUnfOnly").classList.contains("on") && st !== "unfamiliar") return false;
    if (q && !(t.abbr.toLowerCase().includes(q) || t.full.toLowerCase().includes(q) || t.meaning.toLowerCase().includes(q))) return false;
    return true;
  });
  $("list").innerHTML = rows.length
    ? rows.map(t => {
        const st = statusOf(t);
        return '<div class="row"><span class="dot ' + st + '"></span>' +
          '<div class="row-main"><div class="row-head"><span class="row-abbr">' + esc(t.abbr) + '</span>' +
          '<span class="row-full">' + esc(t.full) + '</span></div>' +
          '<div class="row-meaning">' + esc(t.meaning) + '</div></div>' +
          '<span class="row-cat">' + esc(t.category) + '</span></div>';
      }).join("")
    : '<div class="empty">没有匹配的术语</div>';
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
$("search").oninput = renderList;
$("listDomainSel").onchange = renderList;
$("listKnownOnly").onclick = () => { $("listKnownOnly").classList.toggle("on"); renderList(); };
$("listUnfOnly").onclick = () => { $("listUnfOnly").classList.toggle("on"); renderList(); };

/* ---------- 视图切换 ---------- */
$("tabFlash").onclick = () => switchView("flash");
$("tabList").onclick = () => switchView("list");
function switchView(v) {
  const isFlash = v === "flash";
  $("tabFlash").classList.toggle("active", isFlash);
  $("tabList").classList.toggle("active", !isFlash);
  $("viewFlash").classList.toggle("hidden", !isFlash);
  $("viewList").classList.toggle("hidden", isFlash);
  if (isFlash) renderCard(); else renderList();
}

/* ---------- 初始化 ---------- */
$("shuffleBtn").classList.toggle("on", shuffle);
$("unfamiliarBtn").classList.toggle("on", onlyUnfamiliar);
refreshCats();
buildDeck();

document.addEventListener("keydown", e => {
  if ($("viewFlash").classList.contains("hidden")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); $("card").click(); }
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "1") $("markUnfamiliar").click();
  if (e.key === "2") $("markKnown").click();
});
</script>
</body>
</html>
